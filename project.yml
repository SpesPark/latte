name: Latte
options:
  bundleIdPrefix: com.parkbyeongjun
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  developmentLanguage: en
  # S31 — i18n P1. Listed regions reach App Store via CFBundleLocalizations
  # auto-derived from these on build. xcstrings file at Resources/Localizable.xcstrings
  # is the single source of truth for all 11 languages.
  # S33 fix: must live inside `options:` block — xcodegen 2.45.4 silently ignores
  # top-level `knownRegions:`. Pre-fix the generated pbxproj only had `Base, en`
  # so .lproj/Localizable.strings for the other 10 langs were stripped at build.
  knownRegions:
    - en
    - ko
    - ja
    - zh-Hans
    - zh-Hant
    - es
    - de
    - fr
    - pt-BR
    - it
    - ru

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "4BXCVHZANL"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Xcode 15+ String Catalog auto-extraction
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Latte:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.parkbyeongjun.latte
        # iCloud sync (docs/design/10) ships dark behind the LATTE_ICLOUD_SYNC
        # compile-time kill-switch — OFF by default, so CloudKit code is never
        # compiled and the default build signs with the no-CloudKit entitlements
        # below. To enable (Phase 2, needs S8.5 + a provisioned container):
        #   1. add LATTE_ICLOUD_SYNC to SWIFT_ACTIVE_COMPILATION_CONDITIONS
        #   2. switch CODE_SIGN_ENTITLEMENTS to Configuration/Latte.icloud.entitlements
        # The staged Latte.icloud.entitlements is INACTIVE until then.
        CODE_SIGN_ENTITLEMENTS: Configuration/Latte.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  LatteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parkbyeongjun.latte.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Latte

schemes:
  Latte:
    build:
      targets:
        Latte: all
        LatteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LatteTests
    archive:
      config: Release
