name: Latte
options:
  bundleIdPrefix: com.parkbyeongjun
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  developmentLanguage: en

# S31 — i18n P1. Listed regions reach App Store via CFBundleLocalizations
# auto-derived from these on build. xcstrings file at Resources/Localizable.xcstrings
# is the single source of truth for all 11 languages.
knownRegions:
  - en
  - ko
  - ja
  - zh-Hans
  - zh-Hant
  - es
  - de
  - fr
  - pt-BR
  - it
  - ru

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Xcode 15+ String Catalog auto-extraction
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Latte:
    type: application
    platform: macOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.parkbyeongjun.latte
        CODE_SIGN_ENTITLEMENTS: Configuration/Latte.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  LatteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parkbyeongjun.latte.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Latte

schemes:
  Latte:
    build:
      targets:
        Latte: all
        LatteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LatteTests
    archive:
      config: Release
